

version: '3.8'

services:
  banco:
    image: mysql:5.7
    container_name: toshiro-db
    environment:
      MYSQL_ROOT_PASSWORD: 'senha_do_banco'
      MYSQL_DATABASE: 'meubanco'
    ports:
      - "3306:3306"
    volumes:
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql

  web:
    image: nginx:latest
    container_name: toshiro-web
    ports:
      - "8080:4500" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - banco
